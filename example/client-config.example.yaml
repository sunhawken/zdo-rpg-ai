# Logging configuration
log:
  consoleLevel: info
  fileLevel: info
  filePath: logs/client.log

# Server connection
server:
  host: localhost
  port: 8080
  maxMessageSize: 10485760
  rpcTimeoutMs: 5000
  reconnectDelayMs: 2000
  clientToken: ""

# Mod connection
# provider: openmw | emulator
mod:
  provider: openmw
  emulator:
    host: localhost
    port: 8081
  openmw:
    dataDir: /path/to/openmw/data
    logFilePath: /path/to/openmw/openmw.log
    mp3MaxFiles: 10
    pollIntervalMs: 50

stripDiacritics: false

# Voice capture (optional)
voiceCapture:
  enabled: false
  sampleRate: 16000
  frameSizeMs: 20
  deviceIndex: -1
  pushToTalk:
    key: Y
    subMode: hold
    releaseDelayMs: 400
  # Hot mic: continuous voice-activity detection instead of push-to-talk. When enabled, speech
  # starts/stops the mic on its own -- pushToTalk above stays inert while this is on.
  hotMic:
    enabled: false
    energyThreshold: 600
    minSpeechMs: 250
    silenceTimeoutMs: 1000
