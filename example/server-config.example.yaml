# Logging configuration
log:
  consoleLevel: info
  fileLevel: info
  filePath: logs/server.log

# Database paths
database:
  mainDbPath: main.db
  saveGameDbPath: save.db

# HTTP / WebSocket server
httpServer:
  host: 0.0.0.0
  port: 8080
  maxMessageSize: 10485760
  rpcTimeoutMs: 5000
  clientToken: ""

# Text-to-speech (dummy | elevenlabs | openai)
tts:
  provider: dummy
  # elevenLabs:
  #   apiKey: ""
  #   model: eleven_multilingual_v2
  #   stability: 0.75
  #   similarityBoost: 0.75
  #   style: 0.2
  #   useSpeakerBoost: false
  #   voiceIdMapping:
  #     fallback: "<voiceId>"
  #     byRaceSex:
  #       dm: "<voiceId>"
  #       df: "<voiceId>"
  # openAi:
  #   apiKey: ""
  #   model: tts-1
  #   baseUrl: https://api.openai.com
  #   voiceMapping:
  #     fallback: alloy
  #     byRaceSex:
  #       dm: onyx
  #       df: nova
  mp3Speed:
    ffmpegExePath: ffmpeg
    charactersPerSecond: 15

# Speech-to-text (dummy | deepgram | openai)
stt:
  provider: dummy
  # deepgram:
  #   apiKey: ""
  #   sampleRate: 16000
  #   encoding: linear16
  #   language: en
  #   model: nova-2
  # openAi:
  #   apiKey: ""
  #   model: whisper-1
  #   baseUrl: https://api.openai.com
  #   sampleRate: 16000
  #   language: en

# Director
director:
  compactThreshold: 30
  compactKeepRecent: 10
  # Spontaneous NPC-to-NPC ambient chatter between NPCs currently near the player.
  ambientDialogue:
    enabled: true
    checkIntervalSec: 45
    chancePerCheck: 0.15

# LLM (dummy | gemini | openai)
llm:
  main:
    provider: dummy
    # gemini:
    #   apiKey: ""
    #   model: gemini-2.5-flash
    #   thinkingBudget: 0
    # openAi:
    #   apiKey: ""
    #   model: gpt-4o
    #   baseUrl: https://api.openai.com
  simple:
    provider: dummy
    # gemini:
    #   apiKey: ""
    #   model: gemini-2.0-flash-lite
    #   thinkingBudget: 0
    # openAi:
    #   apiKey: ""
    #   model: gpt-4o-mini
    #   baseUrl: https://api.openai.com
  # Optional, separate model for combat barks -- falls back to "simple" above if omitted. Worth
  # setting to a non-OpenAI-branded model if using an OpenAI-compatible proxy: OpenAI's own
  # moderation reliably rejects prompts that name two characters as being "in combat" with each
  # other, even for completely mundane one-line game dialogue. Open-weight models (e.g.
  # meta-llama/llama-3.1-70b-instruct via NanoGPT) don't hit this filter.
  # combat:
  #   provider: dummy
  #   openAi:
  #     apiKey: ""
  #     model: meta-llama/llama-3.1-70b-instruct
  #     baseUrl: https://api.openai.com
